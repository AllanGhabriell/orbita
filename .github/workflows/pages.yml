name: Testar e publicar Órbita
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe do JavaScript
        run: node --check app.js && node --check stage2.js && node --check stage3.js && node --check stage4.js && node --check boot.js && node --check stage5.js && node --check stage6.js && node --check stage7.js && node --check sw.js
      - name: Dependências de teste do navegador
        run: npm install --no-save --no-package-lock puppeteer-core@24
      - name: Testes das etapas 1 a 7 e do formulário no Chromium
        run: node --test tests/*.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
