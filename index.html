<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <meta name="description" content="Órbita — planejamento pessoal, estudos e evolução.">
  <title>Órbita · Meu planejamento</title>
  <link rel="icon" href="./assets/orbita.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./stage2.css">
  <script src="./app.js" defer></script>
  <script src="./stage2.js" defer></script>
</head>
<body data-theme="dark">
  <div class="ambient" aria-hidden="true"><div class="ambient-blob blob-a"></div><div class="ambient-blob blob-b"></div><div id="cursor-glow"></div></div>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Menu principal">
      <a class="brand" href="#inicio" aria-label="Órbita - início">
        <img src="./assets/orbita.svg" alt="" width="34" height="34">
        <span><strong>órbita</strong><small>PLANEJAMENTO PESSOAL</small></span>
      </a>
      <div class="side-divider"></div>
      <nav class="side-nav" aria-label="Áreas principais">
        <button type="button" class="nav-button active" data-nav="inicio"><span class="nav-icon">◈</span><span>Início</span></button>
        <button type="button" class="nav-button" data-nav="planejamento"><span class="nav-icon">▦</span><span>Planejamento</span></button>
        <button type="button" class="nav-button" data-nav="organizar"><span class="nav-icon">◫</span><span>Organizar</span></button>
        <button type="button" class="nav-button" data-nav="perfil"><span class="nav-icon">◉</span><span>Perfil e evolução</span></button>
      </nav>
      <div class="side-spacer"></div>
      <div class="side-divider"></div>
      <nav class="side-nav side-secondary">
        <button type="button" class="nav-button" data-nav="disponibilidade"><span class="nav-icon">◷</span><span>Disponibilidade</span></button>
        <button type="button" class="nav-button" data-nav="configuracoes"><span class="nav-icon">⚙</span><span>Preferências</span></button>
      </nav>
      <small class="sidebar-note">ÓRBITA · ETAPA 1</small>
    </aside>

    <div class="main-shell">
      <header class="topbar">
        <div class="top-title"><div class="eyebrow" id="top-eyebrow">SEU ESPAÇO</div><strong id="top-title">Meu dia</strong></div>
        <div class="top-actions">
          <span class="state-dot" id="storage-indicator" title="Dados salvos neste dispositivo"></span>
          <button type="button" class="icon-button" id="theme-switch" title="Alternar tema" aria-label="Alternar tema">☾</button>
          <button type="button" class="icon-button" id="settings-switch" title="Preferências" aria-label="Preferências">⚙</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
      <footer class="mobile-nav" aria-label="Navegação inferior">
        <button type="button" data-nav="inicio" class="mobile-link active"><span>◈</span><small>Início</small></button>
        <button type="button" data-nav="planejamento" class="mobile-link"><span>▦</span><small>Semana</small></button>
        <button type="button" data-nav="organizar" class="mobile-link"><span>◫</span><small>Organizar</small></button>
        <button type="button" data-nav="perfil" class="mobile-link"><span>◉</span><small>Perfil</small></button>
        <button type="button" data-nav="configuracoes" class="mobile-link"><span>⚙</span><small>Mais</small></button>
      </footer>
    </div>
  </div>
  <div id="modal-host"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
